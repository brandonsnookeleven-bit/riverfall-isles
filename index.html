<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d14;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(90vw,400px);box-sizing:border-box;background:rgba(42,29,18,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,228,180,.2);border-radius:16px;padding:10px 16px 8px;color:#f6e8cc;letter-spacing:.14em;font-size:11px;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.row{display:flex;align-items:center;gap:10px;margin:5px 0}.lbl{width:62px}.bar{flex:1;height:8px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden}

#springs{display:flex;gap:7px}.drop{width:11px;height:14px;background:radial-gradient(circle at 40% 60%,#9ff5ee,#2bb7b0);border-radius:50% 50% 50% 50%/62% 62% 40% 40%;transform:rotate(180deg);box-shadow:0 0 6px rgba(120,240,230,.6);transition:all .4s}.drop.used{background:rgba(255,255,255,.18);box-shadow:none}
#hint{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff6e4;background:rgba(32,22,12,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:10px 18px;border-radius:22px;font-size:14px;letter-spacing:.03em;transition:opacity .8s;text-align:center;pointer-events:none;max-width:84vw;white-space:normal}
.btn{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));color:#f6e8cc;background:rgba(42,29,18,.55);border:1px solid rgba(255,228,180,.35);border-radius:22px;padding:10px 22px;font:14px Georgia,serif;letter-spacing:.2em;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#reset{left:50%;transform:translateX(-50%)}#fpsBtn{left:16px;padding:10px 12px;font-size:11px;letter-spacing:.1em}#fps{display:none;position:fixed;left:12px;top:calc(142px + env(safe-area-inset-top));color:#eaffd8;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px;font:11px/1.3 monospace;pointer-events:none}#home{right:16px;padding:10px 14px;letter-spacing:.05em}
.ripple{position:fixed;width:22px;height:22px;border:2px solid rgba(160,245,235,.95);border-radius:50%;transform:translate(-50%,-50%) scale(.3);animation:rip .75s ease-out forwards;pointer-events:none}.ripple.bad{border-color:rgba(255,200,150,.8)}
@keyframes rip{to{transform:translate(-50%,-50%) scale(3.6);opacity:0}}
#win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,12,6,.35);opacity:0;pointer-events:none;transition:opacity 1s}
#win.show{opacity:1;pointer-events:auto}#win .card{background:rgba(48,33,20,.82);border:1px solid rgba(255,228,180,.35);border-radius:20px;padding:26px 30px;text-align:center;color:#f6e8cc;max-width:80vw}
#win h2{margin:0 0 8px;font-weight:normal;letter-spacing:.16em;font-size:20px}#win p{margin:0 0 18px;font-size:14px;opacity:.85}
#win button{color:#2b1d10;background:linear-gradient(#f0d48e,#c9a052);border:0;border-radius:22px;padding:11px 26px;font:15px Georgia,serif;letter-spacing:.15em}

#meterWrap{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
#meter{--p:0;position:relative;flex:1;height:14px;margin:0 12px}
#meter .trk{position:absolute;inset:0;border-radius:8px;background:linear-gradient(90deg,#7d7368 0%,#a39274 22%,#b5a35a 42%,#7fae3c 64%,#3f9a2e 84%,#23781f 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,.45),0 1px 0 rgba(255,240,210,.25);overflow:hidden}
#meter .trk:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
#meter .rest{position:absolute;top:0;bottom:0;right:0;left:calc(var(--p)*100%);background:rgba(28,18,10,.62);transition:left .7s cubic-bezier(.3,.8,.3,1)}
#meter .tick{position:absolute;top:3px;bottom:3px;width:1px;background:rgba(255,240,210,.35)}
#meter .goal{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:#ffe7a8;border-radius:1px;box-shadow:0 0 6px rgba(255,220,140,.8)}
#meter .goal:after{content:'';position:absolute;top:-6px;left:-3px;border:4px solid transparent;border-top:5px solid #ffe7a8}
#thumb{position:absolute;top:50%;left:calc(var(--p)*100%);width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#fff7df,#e9d6a6 55%,#b99a5c);box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 -2px 3px rgba(90,60,20,.35);transition:left .7s cubic-bezier(.3,.8,.3,1);display:flex;align-items:center;justify-content:center}
#thumb svg{width:22px;height:22px;overflow:visible}
#thumb .lf{transform-origin:12px 17px;transform:scale(calc(.45 + var(--p)*.6));transition:transform .7s,filter .7s;filter:saturate(calc(.25 + var(--p)*.95)) hue-rotate(calc((1 - var(--p))*-38deg)) brightness(calc(.85 + var(--p)*.2))}
#meter.lush #thumb{box-shadow:0 0 12px rgba(170,255,120,.9),0 3px 8px rgba(0,0,0,.45)}
#lifeP{width:40px;text-align:right;font-size:13px;letter-spacing:.04em;color:#e9ffd6}

#lvlRow{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px;font-size:10.5px;letter-spacing:.2em;color:#ffe9b8}
#lvlName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvlBtn{pointer-events:auto;color:#f6e8cc;background:rgba(255,235,190,.12);border:1px solid rgba(255,228,180,.35);border-radius:12px;padding:3px 10px;font:10px Georgia,serif;letter-spacing:.16em}
#hud{pointer-events:none}
body.relax #hud,body.relax .btn,body.relax #hint,body.relax #fps,body.relax #win{opacity:0!important;pointer-events:none!important;transition:opacity .8s}
#muteBtn{position:fixed;top:calc(124px + env(safe-area-inset-top));right:12px;z-index:30;width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,228,180,.35);background:rgba(42,29,18,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:rgba(246,232,204,.88);padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}#muteBtn .x{display:none}#muteBtn.off .x{display:inline}#muteBtn.off .w{display:none}#muteBtn.off{opacity:.7}body.relax #muteBtn{top:calc(12px + env(safe-area-inset-top));right:54px}#muteBtn,#trackBtn{position:fixed;top:calc(124px + env(safe-area-inset-top));right:12px;z-index:30;width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,228,180,.35);background:rgba(42,29,18,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:rgba(246,232,204,.88);padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}#trackBtn{right:54px}body.relax #trackBtn{top:calc(12px + env(safe-area-inset-top));right:96px}#trackToast{position:fixed;top:calc(166px + env(safe-area-inset-top));right:12px;z-index:30;padding:6px 12px;border-radius:14px;background:rgba(42,29,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#f6e8cc;font:12px Georgia,serif;letter-spacing:.08em;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none}#trackToast.show{opacity:1;transform:none}body.relax #trackToast{top:calc(54px + env(safe-area-inset-top))}
#relaxExit{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;display:none;width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,228,180,.35);background:rgba(42,29,18,.28);color:rgba(246,232,204,.8);font:15px Georgia,serif;padding:0}
body.relax #relaxExit{display:block}
.lv .rx{margin-left:auto;font-size:10px;letter-spacing:.15em;padding:6px 9px;border-radius:13px;background:rgba(255,235,190,.15);border:1px solid rgba(255,228,180,.4);color:#f6e8cc;white-space:nowrap}
#grow{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,12,6,.55);color:#f6e8cc;font:15px Georgia,serif;letter-spacing:.22em;z-index:20}
#grow.show{display:flex}
#win .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#win .ghost{background:rgba(255,235,190,.12);color:#f6e8cc;border:1px solid rgba(255,228,180,.4)}
#win .sub{font-size:11px;letter-spacing:.28em;opacity:.7;margin-bottom:6px}
#levels{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,12,6,.45);opacity:0;pointer-events:none;transition:opacity .4s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#levels.show{opacity:1;pointer-events:auto}
#levels .card{background:rgba(48,33,20,.9);border:1px solid rgba(255,228,180,.35);border-radius:20px;padding:20px 18px 16px;color:#f6e8cc;width:min(86vw,360px)}
#levels h2{margin:0 0 12px;text-align:center;font-weight:normal;letter-spacing:.2em;font-size:17px}
.lv{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 9px;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,228,180,.25);background:linear-gradient(90deg,rgba(80,140,50,.28),rgba(255,235,190,.06));color:#f6e8cc;font:15px Georgia,serif;text-align:left;letter-spacing:.06em}
.lv.cur{border-color:#ffe7a8;box-shadow:0 0 10px rgba(255,220,140,.35)}
.lv.locked{background:rgba(0,0,0,.25);color:rgba(246,232,204,.45)}
.lv .n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff7df,#e9d6a6 55%,#b99a5c);color:#3a2810;font-weight:bold;flex:none}
.lv.locked .n{filter:grayscale(1) brightness(.6)}
.lv .t{flex:1;display:flex;flex-direction:column}.lv small{font-size:11px;opacity:.7;letter-spacing:.04em;margin-top:2px}
.lv .lock{font-size:14px}
